<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icona dell'app: carrello scuro su fondo giallo.

  Il carrello e' lo stesso simbolo che la barra in basso usa per la sezione
  Lista, cosi' l'icona e l'app parlano la stessa lingua. Il tracciato viene da
  Material Symbols (Apache 2.0).

  Questo file e' la sorgente: i PNG per le varie piattaforme si rigenerano con
  `tool/genera_icone.sh`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fondo: angoli arrotondati per le piattaforme che non ritagliano da se'. -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#FFC400"/>
