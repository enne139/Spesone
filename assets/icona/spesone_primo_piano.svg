<?xml version="1.0" encoding="UTF-8"?>
<!--
  Strato in primo piano dell'icona adattiva di Android: solo il carrello, su
  fondo trasparente.
  
  Android ritaglia l'icona adattiva in forme diverse a seconda del telefono
  (cerchio, goccia, quadrato stondato), quindi il disegno sta nella meta'
  centrale della tela: cosi' nessun ritaglio lo tocca. Il colore del fondo lo
  mette flutter_launcher_icons (#FFC400).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(23) translate(-11.3 -12)" fill="#2B2200">
