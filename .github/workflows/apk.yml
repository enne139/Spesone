# Costruisce l'APK di Spesone e lo pubblica in una release di GitHub, da cui
# Obtainium lo installa e lo aggiorna.
#
# Si avvia da solo quando si pubblica un tag che comincia per "v" (es. v1.0.0),
# e si puo' lanciare a mano dalla scheda Actions per provare la build senza
# pubblicare niente.
name: APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serve a creare la release e ad allegarci l'APK.
permissions:
  contents: write

jobs:
  apk:
    name: Costruisci e pubblica
    runs-on: ubuntu-latest

    env:
      # I segreti si leggono qui perche' una condizione `if` non puo' leggerli
      # direttamente: cosi' il passo della firma sa se la chiave c'e'.
      CHIAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scarica le dipendenze
        run: flutter pub get

      - name: Rigenera il codice di drift
        # I file .g.dart stanno nel repository, ma rigenerarli qui garantisce
        # che l'APK corrisponda sempre alle tabelle scritte a mano.
        run: dart run build_runner build

      - name: Analisi statica
        run: flutter analyze

      - name: Prove
        run: flutter test

      - name: Calcola la versione
        id: versione
        # Da un tag "v1.2.3" esce il nome versione "1.2.3". Lanciando a mano il
        # flusso non c'e' tag, quindi si usa la versione del pubspec.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOME="${GITHUB_REF_NAME#v}"
          else
            NOME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "Versione: $NOME"

      # I tre passi che seguono preparano la firma. Sono separati di proposito:
      # i log delle esecuzioni sono leggibili solo da chi amministra il
      # repository, quindi il *nome* del passo che fallisce deve bastare a
      # capire cos'e' andato storto.
      #
      # Senza chiave propria ogni macchina firma con una chiave di debug
      # diversa e Android rifiuta l'aggiornamento ("firma non corrispondente"):
      # con i segreti impostati, tutte le release sono firmate uguali.
      - name: Decodifica la chiave di firma
        if: env.CHIAVE_BASE64 != ''
        run: |
          # Spazi e a capo finiscono facilmente nel segreto quando si copia e
          # incolla, e manderebbero base64 in errore: via prima di decodificare.
          printf '%s' "$CHIAVE_BASE64" | tr -d '[:space:]' | base64 --decode \
            > "${RUNNER_TEMP}/spesone.jks"
          BYTE=$(stat -c%s "${RUNNER_TEMP}/spesone.jks")
          echo "Archivio decodificato: ${BYTE} byte"
          if [ "$BYTE" -lt 1000 ]; then
            echo "::error::L'archivio decodificato e' troppo piccolo (${BYTE} byte): il segreto ANDROID_KEYSTORE_BASE64 e' probabilmente incompleto. Rigeneralo con 'base64 -w0 spesone.jks'."
            exit 1
          fi

      - name: Verifica chiave, password e alias
        if: env.CHIAVE_BASE64 != ''
        env:
          PASSWORD_ARCHIVIO: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Meglio accorgersi qui che password o alias non tornano, con un
          # messaggio chiaro, che a meta' della build di Gradle.
          if ! keytool -list -keystore "${RUNNER_TEMP}/spesone.jks" \
              -storepass "$PASSWORD_ARCHIVIO" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::La chiave non si apre: controlla ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "Chiave valida, alias '${ALIAS}' presente."

      - name: Scrivi key.properties
        if: env.CHIAVE_BASE64 != ''
        env:
          PASSWORD_ARCHIVIO: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD_CHIAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=${RUNNER_TEMP}/spesone.jks"
            echo "storePassword=${PASSWORD_ARCHIVIO}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${PASSWORD_CHIAVE}"
          } > android/key.properties

      - name: Avvisa se la firma manca
        if: env.CHIAVE_BASE64 == ''
        run: |
          echo "::warning::Nessuna chiave di firma nei segreti: l'APK sara' firmato con la chiave di debug e gli aggiornamenti in Obtainium falliranno. Vedi README.md."

      - name: Costruisci l'APK
        # Un solo APK per tutte le architetture: Obtainium non deve scegliere.
        # Il numero di build cresce a ogni esecuzione, come Android richiede per
        # riconoscere un aggiornamento.
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versione.outputs.nome }}" \
            --build-number="${{ github.run_number }}"

      - name: Rinomina l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "Spesone-v${{ steps.versione.outputs.nome }}.apk"

      - name: Conserva l'APK fra gli artefatti
        # Utile quando il flusso parte a mano: l'APK si scarica dalla pagina
        # dell'esecuzione senza pubblicare una release.
        uses: actions/upload-artifact@v4
        with:
          name: Spesone-v${{ steps.versione.outputs.nome }}
          path: Spesone-*.apk
          if-no-files-found: error

      - name: Pubblica la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Spesone-*.apk
          generate_release_notes: true
